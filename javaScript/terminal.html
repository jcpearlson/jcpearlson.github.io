<script>
(function() {
  const ASCII = `     ██╗ ██████╗██████╗
     ██║██╔════╝██╔══██╗
     ██║██║     ██████╔╝
██   ██║██║     ██╔═══╝
╚█████╔╝╚██████╗██║
 ╚════╝  ╚═════╝╚═╝`;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function homeChrome() {
    return `<nav class="t-tabs" aria-label="Main navigation">
      ${['home', 'about', 'articles', 'projects', 'contact'].map(t => `<a href="${t === 'home' ? '/' : '/' + t + '/'}" class="t-tab${t === 'home' ? ' t-tab-active' : ''}"${t === 'home' ? ' aria-current="page"' : ''}><span class="t-tab-indicator" aria-hidden="true">${t === 'home' ? '▸' : '&nbsp;'}</span>${t}</a>`).join('')}
      <div class="t-tabs-spacer"></div><div class="t-title">jcp@joshpearlson: ~/</div>
    </nav>`;
  }

  function latestCard(post) {
    const tags = post.cats.map(c => `<span class="t-chip">${esc(c)}</span>`).join('');
    const art = post.image
      ? `<div class="t-latest-visual"><img src="${esc(post.image)}" alt="" loading="lazy" /></div>`
      : '';
    return `<a href="${esc(post.href)}" class="t-latest-card${post.image ? ' t-latest-with-image' : ''}"><div class="t-latest-copy">
      <div class="t-latest-label"><strong>LATEST ARTICLE</strong><span>${esc(post.date)}</span></div>
      <h2 class="t-latest-title">${esc(post.title)}</h2>
      <div class="t-latest-excerpt">${esc(post.excerpt)}</div>
      <div class="t-latest-meta">${tags}<span class="t-read-arrow">Read article →</span></div>
    </div>${art}</a>`;
  }

  function renderHome(mount) {
    mount.innerHTML = homeChrome() + `<div class="t-body" id="t-body">
      <div class="t-hero"><div class="t-intro">
        <div class="t-command"><span class="t-prompt">$</span>whoami</div>
        <h1>Josh Pearlson<span aria-hidden="true">_</span></h1>
        <p class="t-role">Quant @ BlackRock.<br>I write about <span class="t-accent">markets & machines.</span></p>
        <div class="t-actions"><a class="t-primary" href="/articles/">Read the articles →</a><a class="t-text-link" href="/projects/">Explore projects →</a></div>
      </div><aside class="t-identity" aria-label="JCP terminal identity">
        <div class="t-identity-label"><span>~/identity.txt</span><span>UTF-8</span></div>
        <div class="t-ascii-frame"><pre class="t-ascii" aria-label="JCP ASCII logo">${ASCII}</pre></div>
        <div class="t-identity-footer"><span>finance / ML / probability</span><span class="t-accent">NYC</span></div>
      </aside></div>
      <section aria-label="Latest article"><div class="t-section-heading"><h2><span class="t-prompt">$</span>cat latest.md</h2><a href="/articles/">All articles →</a></div>
        <div id="t-latest-mount"><a class="t-text-link" href="/articles/">Browse the latest writing →</a></div>
      </section>
      <nav aria-label="Explore the site"><div class="t-section-heading"><h2><span class="t-prompt">$</span>ls ./</h2></div>
        <div class="t-ls-grid">
          <a href="/about/" class="t-ls-cell"><div class="t-ls-name">01 / about →</div><div class="t-ls-path">Background, research & interests</div></a>
          <a href="/projects/" class="t-ls-cell"><div class="t-ls-name">02 / projects →</div><div class="t-ls-path">Tools, experiments & things I’ve built</div></a>
          <a href="/contact/" class="t-ls-cell"><div class="t-ls-name">03 / contact →</div><div class="t-ls-path">Say hello. Cold emails welcome.</div></a>
        </div>
      </nav>
    </div><div class="t-status"><span><span class="t-status-dot">●</span> online</span><span id="t-status-count">Articles / projects</span><span class="t-status-weather" id="t-status-weather">New York, NY</span></div>`;
  }

  function updateWeather() {
    const el = document.getElementById('t-status-weather');
    if (!el) return;
    // Keep the location useful when the weather service is unavailable.
    el.textContent = 'New York, NY';
    fetch('https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m&temperature_unit=fahrenheit')
      .then(r => { if (!r.ok) throw new Error('Weather unavailable'); return r.json(); })
      .then(d => {
        const temperature = d.current && d.current.temperature_2m;
        if (typeof temperature === 'number' && Number.isFinite(temperature)) el.textContent = `NYC ${Math.round(temperature)}°F`;
      }).catch(() => {});
  }

  function init() {
    const mount = document.getElementById('jcp-terminal');
    if (!mount) return; // Article chrome owns its own header and status bar.
    const isHome = location.pathname === '/' || location.pathname === '/index.html';
    if (isHome) renderHome(mount);
    mount.querySelectorAll('.t-tabs').forEach(nav => {
      nav.setAttribute('role', 'navigation');
      nav.setAttribute('aria-label', 'Main navigation');
    });
    mount.querySelectorAll('.t-tab-active').forEach(a => a.setAttribute('aria-current', 'page'));
    updateWeather();

    // Read Quarto's rendered listing so date, categories and images stay in sync.
    const listingUrl = new URL('/articles/', location.origin);
    const listing = document.querySelector('.quarto-listing');
    const getListing = listing ? Promise.resolve(document) : fetch(listingUrl)
      .then(r => { if (!r.ok) throw new Error('Listing unavailable'); return r.text(); })
      .then(html => new DOMParser().parseFromString(html, 'text/html'));
    getListing.then(doc => {
      const posts = Array.from(doc.querySelectorAll('.quarto-post'));
      const count = document.getElementById('t-status-count');
      if (count) count.textContent = `${posts.length} articles / 7 projects`;
      if (!isHome || !posts.length) return;
      const post = posts[0];
      const link = post.querySelector('.listing-title a');
      if (!link) return;
      const img = post.querySelector('.thumbnail img');
      const raw = (post.querySelector('.listing-description')?.textContent || '').trim().replace(/\s+/g, ' ');
      const clipped = raw.length > 230 ? raw.slice(0, 227).replace(/\s+\S*$/, '') + '…' : raw;
      const sentenceEnd = Math.max(clipped.lastIndexOf('. '), clipped.lastIndexOf('! '), clipped.lastIndexOf('? '));
      const excerpt = sentenceEnd > 60 ? clipped.slice(0, sentenceEnd + 1) : clipped;
      document.getElementById('t-latest-mount').innerHTML = latestCard({
        href: new URL(link.getAttribute('href'), listingUrl).href,
        title: link.textContent.trim(), excerpt,
        date: post.querySelector('.listing-date')?.textContent.trim() || '',
        cats: Array.from(post.querySelectorAll('.listing-category')).map(c => c.textContent.trim()),
        image: img?.getAttribute('src') ? new URL(img.getAttribute('src'), listingUrl).href : ''
      });
    }).catch(() => {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
