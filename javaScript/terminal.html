<script>
// Shared terminal chrome for every page: the tab bar, the status bar and the
// helpers the page-specific includes use (window.JCP). Included site-wide from
// _quarto.yml, so it runs before any page-level include.
window.JCP = (function() {
  const NAV = [
    ['home', '/'],
    ['about', '/about/'],
    ['articles', '/articles/'],
    ['projects', '/projects/'],
    ['contact', '/contact/'],
  ];
  const LOCATION = 'New York, NY';
  const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m&temperature_unit=fahrenheit';
  const SUBSCRIBE_URL = 'https://buttondown.com/api/emails/embed-subscribe/jcp';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Path segments without a trailing index.html, e.g. ['articles', 'posts', 'slug'].
  function pathParts() {
    const parts = location.pathname.split('/').filter(Boolean);
    if (/^index\.html?$/.test(parts[parts.length - 1])) parts.pop();
    return parts;
  }

  function tabBar(title, section) {
    const tabs = NAV.map(([name, href]) => {
      const active = name === section;
      return `<a href="${href}" class="t-tab${active ? ' t-tab-active' : ''}"${active ? ' aria-current="page"' : ''}>` +
        `<span class="t-tab-indicator" aria-hidden="true">${active ? '▸' : '&nbsp;'}</span>${name}</a>`;
    }).join('');
    return `<nav class="t-tabs" aria-label="Main navigation">${tabs}` +
      `<div class="t-tabs-spacer"></div><div class="t-title">jcp@joshpearlson: ${esc(title)}</div></nav>`;
  }

  function statusBar(label, middle, middleId) {
    return `<div class="t-status"><span><span class="t-status-dot">●</span> ${esc(label)}</span>` +
      `<span id="${middleId}">${esc(middle)}</span>` +
      `<span class="t-status-weather" id="t-status-weather">${LOCATION}</span></div>`;
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function fetchDoc(path) {
    return fetch(new URL(path, location.origin))
      .then(r => { if (!r.ok) throw new Error(path + ' unavailable'); return r.text(); })
      .then(html => new DOMParser().parseFromString(html, 'text/html'));
  }

  // Resolve with the rendered article listing, reusing this page's copy when present.
  function articleListing() {
    return document.querySelector('.quarto-listing') ? Promise.resolve(document) : fetchDoc('/articles/');
  }

  // Count items on this page when it is the listing (read now, before Quarto's
  // category filter can remove any), otherwise on the fetched listing page.
  function countOf(listingSelector, path, itemSelector) {
    if (document.querySelector(listingSelector)) return Promise.resolve(document.querySelectorAll(itemSelector).length);
    return fetchDoc(path).then(doc => doc.querySelectorAll(itemSelector).length);
  }

  function updateWeather() {
    const w = document.getElementById('t-status-weather');
    if (!w) return;
    fetch(WEATHER_URL)
      .then(r => { if (!r.ok) throw new Error('Weather unavailable'); return r.json(); })
      .then(d => {
        const t = d.current && d.current.temperature_2m;
        if (typeof t === 'number' && Number.isFinite(t)) w.textContent = `NYC ${Math.round(t)}°F`;
      }).catch(() => {});
  }

  function updateCounts() {
    const count = document.getElementById('t-status-count');
    if (!count) return;
    Promise.all([
      countOf('.quarto-listing', '/articles/', '.quarto-post'),
      countOf('.jcp-proj-grid', '/projects/', '.jcp-proj-card'),
    ]).then(([a, p]) => { count.textContent = `${a} articles / ${p} projects`; }).catch(() => {});
  }

  // Terminal pages mark their content with #jcp-terminal; data-title, data-tab
  // and data-status override the defaults (used by the 404 page, which GitHub
  // Pages serves at whatever URL was requested).
  function renderPageChrome(mount) {
    const title = mount.dataset.title || '~/' + pathParts().join('/');
    mount.prepend(el(tabBar(title, mount.dataset.tab || pathParts()[0] || 'home')));
    if (mount.dataset.status) {
      mount.append(el(statusBar('online', mount.dataset.status, 't-status-note')));
    } else {
      mount.append(el(statusBar('online', '— articles / — projects', 't-status-count')));
      updateCounts();
    }
  }

  // Article pages are Quarto documents, so the bars are fixed to the viewport.
  function renderArticleChrome() {
    const slug = pathParts().filter(p => p !== 'posts').join('/');
    const top = document.createElement('div');
    top.className = 'jcp-article-tabbar';
    top.innerHTML = tabBar('~/' + slug, 'articles');
    document.body.prepend(top);
    const bottom = document.createElement('div');
    bottom.className = 'jcp-article-statusbar';
    bottom.innerHTML = statusBar('reading', '', 't-art-read-time');
    document.body.append(bottom);
  }

  // Count newsletter signups from any form that opts in with data-subscribe.
  document.addEventListener('submit', e => {
    const form = e.target.closest && e.target.closest('form[data-subscribe]');
    if (form && window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: form.dataset.subscribe, title: form.dataset.subscribeTitle, event: true });
    }
  });

  // These includes run at the end of <body>, so the page markup already exists;
  // drawing the bars now avoids a flash of the page without them.
  const mount = document.getElementById('jcp-terminal');
  if (mount) renderPageChrome(mount);
  else if (document.body.classList.contains('jcp-article-page')) renderArticleChrome();
  updateWeather();

  return { esc, el, pathParts, articleListing, SUBSCRIBE_URL };
})();
</script>
