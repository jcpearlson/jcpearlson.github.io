<script>
// Article header ("$ cat ./slug.md", title, date, categories) and read time.
// The tab and status bars come from terminal.html; the jcp-article-page body
// class is rendered by articles/posts/_metadata.yml so the theme applies
// before these end-of-body scripts run.

const _vp = document.querySelector('meta[name="viewport"]');
if (_vp && !_vp.content.includes('viewport-fit')) {
  _vp.content += ', viewport-fit=cover';
}

document.addEventListener('DOMContentLoaded', function() {
  const main = document.querySelector('main#quarto-document-content');
  if (!main || !document.querySelector('.quarto-title-banner')) return;
  const { esc, pathParts } = window.JCP;

  const slug = pathParts().pop() || 'article';
  const titleEl = document.querySelector('.quarto-title h1');
  const title = titleEl ? titleEl.textContent.trim() : slug;
  let date = '';
  document.querySelectorAll('.quarto-title-meta-heading').forEach(h => {
    const contents = h.nextElementSibling;
    if (h.textContent.trim() === 'Published' && contents) date = contents.textContent.trim();
  });
  const catChips = Array.from(document.querySelectorAll('.quarto-category'))
    .map(e => `<span class="t-chip">${esc(e.textContent.trim())}</span>`).join('');

  const articleHeader = document.createElement('div');
  articleHeader.className = 't-art-header';
  articleHeader.innerHTML = `
    <div class="t-art-prompt"><span class="t-prompt">$</span> cat ./${esc(slug)}.md</div>
    <h1 class="t-art-title">${esc(title)}</h1>
    <div class="t-art-meta">
      <span class="t-art-date">${esc(date)}</span>
      ${catChips}
    </div>
    <div class="t-art-rule"></div>
  `;
  main.prepend(articleHeader);

  const words = main.textContent.trim().split(/\s+/).length;
  const rt = document.getElementById('t-art-read-time');
  if (rt) rt.textContent = `~${Math.max(1, Math.round(words / 220))} min read`;
});
</script>
