<template id="article-actions-template">
  <section class="article-footer newsletter" aria-label="Article actions">
    <div>
      <p>Get new articles in your inbox.</p>
      <form action="https://buttondown.com/api/emails/embed-subscribe/jcp" method="post" class="newsletter-form" target="_blank"
            data-subscribe="subscribe-article" data-subscribe-title="Newsletter Signup - Article">
        <input type="email" name="email" placeholder="you@domain.com" aria-label="Email address" autocomplete="email" required />
        <button type="submit">Subscribe</button>
      </form>
    </div>
    <div class="article-actions">
      <button type="button" class="share-article-button">Share article</button>
      <a href="/articles/">All writing <span aria-hidden="true">→</span></a>
      <span class="visually-hidden" role="status"></span>
    </div>
  </section>
</template>

<script>
(() => {
  const article = document.getElementById('quarto-document-content');
  const template = document.getElementById('article-actions-template');
  const footer = template.content.firstElementChild.cloneNode(true);
  const endnotes = article.querySelector('#quarto-appendix, section.footnotes');
  if (endnotes) endnotes.before(footer);
  else article.append(footer);

  const title = article.querySelector('h1.title').textContent.trim();
  const authors = Array.from(document.querySelectorAll('meta[name="author"]'), meta => meta.content);
  const date = article.querySelector('.quarto-title-meta .date')?.textContent.trim();
  const citation = [`"${title}"`, authors.length ? `by ${authors.join(', ')}` : '', date ? `(Published: ${date})` : '']
    .filter(Boolean).join(' ');
  const button = footer.querySelector('.share-article-button');
  const status = footer.querySelector('[role="status"]');
  const label = button.textContent;
  let feedbackTimer;

  function giveFeedback(buttonLabel, message) {
    clearTimeout(feedbackTimer);
    button.textContent = buttonLabel;
    status.textContent = message;
    feedbackTimer = setTimeout(() => {
      button.textContent = label;
      status.textContent = '';
    }, 3000);
  }

  async function copyCitation(text) {
    if (navigator.clipboard) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch {
        // Clipboard permissions vary. Try the fallback below.
      }
    }

    const previousFocus = document.activeElement;
    const field = document.createElement('textarea');
    field.value = text;
    field.readOnly = true;
    field.style.cssText = 'position:fixed;opacity:0';
    document.body.append(field);
    try {
      field.select();
      if (!document.execCommand('copy')) throw new Error('Copy failed');
    } finally {
      field.remove();
      previousFocus?.focus({ preventScroll: true });
    }
  }

  button.addEventListener('click', async () => {
    const url = location.href;
    if (navigator.share && matchMedia('(pointer: coarse)').matches) {
      try {
        await navigator.share({ title, text: citation, url });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }

    try {
      await copyCitation(`${citation}: ${url}`);
      giveFeedback('Copied', 'Citation copied to clipboard.');
    } catch {
      giveFeedback('Copy failed', 'Could not copy the citation.');
    }
  });
})();
</script>
