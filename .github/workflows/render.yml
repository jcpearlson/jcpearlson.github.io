# Renders the site on every push and pull request so broken includes,
# front matter or links fail here instead of on the live site.
# GitHub Pages still serves the committed docs/ folder.
name: Render site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.56
      - name: Render
        run: quarto render
        env:
          # Listing dates are rendered in local time; match the author's.
          TZ: America/New_York
