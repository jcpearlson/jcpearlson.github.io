project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "404.qmd"
    - "about/index.qmd"
    - "articles/index.qmd"
    - "projects/index.qmd"
    - "contact/index.qmd"
    - "quotes/index.qmd"
    - "articles/posts/**/index.qmd"
    - "articles/posts/**/index.md"
    - "articles/posts/**/index.ipynb"
  resources:
    - "projects/6CardGolf/**"
    - "projects/DigDug/**"
    - "media/*"
    - "artifacts/**"

website:
  title: "Josh Pearlson"
  favicon: media/jcp_logo2.png
  search:
    keyboard-shortcut: ["f"]
    type: overlay
  navbar:
    title: "~/jcp"
    pinned: true
    collapse: false
    right:
      - text: Writing
        href: articles/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: About
        href: about/index.qmd
      - text: Contact
        href: contact/index.qmd
  page-footer:
    left: "Josh Pearlson"
    right:
      - text: Quotes
        href: quotes/index.qmd
      - text: GitHub
        href: https://github.com/jcpearlson

format:
  html:
    theme: slate
    page-layout: full
    html-math-method: plain
    css: css/terminal-theme.css
    include-after-body:
      - _includes/skip-link.html
      - javaScript/signup-analytics.html
      - javaScript/console.html
      - javaScript/analytics.html
