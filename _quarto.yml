project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "404.qmd"
    - "about/index.qmd"
    - "articles/index.qmd"
    - "projects/index.qmd"
    - "contact/index.qmd"
    - "quotes/index.qmd"
    - "articles/posts/**/index.qmd"
    - "articles/posts/**/index.md"
    - "articles/posts/**/index.ipynb"
  resources:
    - "projects/**"
    - "media/*"
    - "css/terminal-theme.css"
    - "artifacts/**"

website:
  title: "Josh Pearlson"
  favicon: media/jcp_logo2.png
  search:
    keyboard-shortcut: ["f"]
  # The Bootstrap navbar is hidden by the terminal chrome (javaScript/terminal.html),
  # but it still hosts Quarto's search overlay, opened with the "f" key.
  navbar: true
format:
  html:
    theme: slate
    include-after-body:
      - javaScript/console.html
      - javaScript/analytics.html
