# Reuse computational output on site renders.
freeze: true

title-block-style: default
date-format: "MMM D, YYYY"
toc: true
toc-location: body
toc-depth: 3
toc-title: On this page

format:
  html:
    page-layout: article
    body-classes: jcp-article-page
    html-math-method: mathjax
    css: ../../css/posts.css
    include-after-body:
      - ../../javaScript/article-navigation.html
      - ../../javaScript/share.html
