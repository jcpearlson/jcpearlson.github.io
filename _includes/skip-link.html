<a class="skip-link" href="#quarto-document-content" hidden>Skip to content</a>
<script>
(() => {
  const link = document.querySelector('.skip-link');
  const header = document.getElementById('quarto-header');
  const main = document.getElementById('quarto-document-content');
  if (!header || !main) return;

  // Keep the link outside the searchable content and first in the tab order.
  header.before(link);
  main.tabIndex = -1;
  link.hidden = false;
})();
</script>
